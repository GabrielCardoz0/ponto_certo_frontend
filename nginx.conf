server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Equivalente ao proxy do vite.config.ts: /api/* -> API, sem o prefixo /api.
    # Mantém front e API no mesmo host, necessário para o cookie httpOnly de sessão.
    # "api" é o nome do serviço da API na rede do docker (ajuste se for outro).
    # Resolve em tempo de requisição (DNS do docker) para o nginx subir mesmo sem a API no ar.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O mime.types padrão da imagem nginx:1.27-alpine não inclui .mjs (só .js) — sem isso,
    # o navegador recebe um content-type genérico e baixa o arquivo em vez de executar, e um
    # Worker type:"module" (ver public/maplibre/, usado pelo MapLibre) nunca inicializa.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
